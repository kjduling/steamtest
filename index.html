<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Steam Lobby Browser</title>
  </head>
  <body>
    <main class="app">
      <header class="app__header">
        <div>
          <h1 class="app__title">Steam Lobby Browser</h1>
          <p class="app__subtitle">
            Live lobbies advertising App ID 480, read through the Steamworks SDK.
          </p>
        </div>
      </header>

      <div class="toolbar">
        <p id="status" class="status" data-connected="false">Starting…</p>
        <span class="toolbar__spacer"></span>
        <button id="refresh" class="button" type="button">Refresh</button>
      </div>

      <p id="notice" class="notice" role="alert" hidden></p>

      <div id="lobbies" class="lobbies"></div>

      <p id="detail" class="detail"></p>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
